# Определение зоны лимита запросов
limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=10r/s;

# Ограничение количества соединений с одного IP
limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

server {
    listen 80;
    server_name secure-llm.auditory.ru;

    # Ограничения на соединения
    limit_conn conn_limit_per_ip 10;
    limit_req zone=req_limit_per_ip burst=20 nodelay;

    access_log /var/log/nginx/secure-llm_access.log;
    error_log /var/log/nginx/secure-llm_error.log warn;

    # Таймауты и буферы
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;
    client_max_body_size 1m;

    # Проксирование фронтенда
    location / {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/v1/llm-proxy {
        # Нет ограничений на IP здесь
        proxy_pass http://localhost:8080/api/v1/llm-proxy; # Указываем точный путь на бэкенде
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Проксирование бэкенда (API)
    location /api/ {
        proxy_pass http://localhost:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Отсекать слишком большие заголовки (защита от Slowloris)
    large_client_header_buffers 4 8k;
}